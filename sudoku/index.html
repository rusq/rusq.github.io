<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sudoku Generator – Printable</title>
  <meta name="description" content="Generate and print large, clear Sudoku puzzles for brain fitness." />
  <style>
    :root{
      --bg:#0f172a;           /* slate-900 */
      --panel:#111827;        /* gray-900 */
      --ink:#e5e7eb;          /* gray-200 */
      --muted:#94a3b8;        /* slate-400 */
      --accent:#22c55e;       /* green-500 */
      --danger:#ef4444;       /* red-500 */
      --grid:#1f2937;         /* gray-800 */
      --line:#222;            /* print-safe */
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f8fafc;        /* slate-50 */
        --panel:#ffffff;
        --ink:#0f172a;       /* slate-900 */
        --muted:#334155;     /* slate-700 */
        --accent:#16a34a;    /* green-600 */
        --grid:#e2e8f0;      /* slate-200 */
      }
    }
    html, body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      background:var(--bg); color:var(--ink);
      display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px;
    }
    .wrap{width:100%; max-width:1100px; display:grid; grid-template-columns: 380px 1fr; gap:20px; align-items:start}
    @media (max-width: 900px){ .wrap{grid-template-columns:1fr;}}

    .card{background:var(--panel); border-radius:16px; padding:18px; box-shadow: 0 8px 24px rgba(0,0,0,.25)}
    h1{font-size:clamp(20px, 3vw, 28px); margin:0 0 6px 0}
    p.sub{margin:0 0 14px 0; color:var(--muted)}

    .controls label{display:block; font-weight:600; margin-top:12px}
    .row{display:flex; gap:10px; align-items:center}
    input[type="range"]{width:100%}
    input[type="number"], select{padding:8px 10px; border-radius:8px; border:1px solid #334155; background:transparent; color:var(--ink); width:100px}
    input[type="checkbox"]{transform: scale(1.2)}
    .btns{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
    button{cursor:pointer; border:none; border-radius:12px; padding:10px 14px; font-weight:700; color:#0b1020; background:var(--accent)}
    button.secondary{background:#38bdf8; color:#0b1020}
    button.muted{background:#cbd5e1; color:#0b1020}

    .status{margin-top:10px; color:var(--muted); font-size:14px}

    .board-area{display:grid; gap:16px}
    .grid{ width:min(92vw, 650px); aspect-ratio:1; background:#fff; color:#000; border:2px solid var(--line);}
    .grid table{ width:100%; height:100%; border-collapse:collapse; table-layout:fixed}
    .grid td{ border:1px solid var(--line); text-align:center; vertical-align:middle; font-weight:700; font-size: clamp(22px, 5.4vw, 40px)}
    /* bold 3x3 boundaries */
    .grid tr:nth-child(3n) td{ border-bottom-width:3px }
    .grid tr:nth-child(1) td{ border-top-width:3px }
    .grid td:nth-child(3n){ border-right-width:3px }
    .grid td:nth-child(1){ border-left-width:3px }

    .legend{display:flex; gap:18px; color:var(--muted); font-size:14px}

    .solution{display:none}
    .solution.visible{display:block}

    .footnote{color:var(--muted); font-size:12px; margin-top:8px}

  </style>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div class="wrap">
    <section class="card no-print">
      <h1>Sudoku Generator — Printable</h1>
      <p class="sub">Create big, clear Sudoku puzzles and print them. Designed for simplicity and readability.</p>

      <div class="controls">
        <label for="percent">Cells removed (difficulty): <span id="percentLabel">60%</span></label>
        <input id="percent" type="range" min="10" max="79" value="60" step="1" aria-describedby="percentHelp" />
        <div id="percentHelp" class="footnote">Unique-solution puzzles need at least 17 clues → at most 79% can be removed.</div>

        <label class="row" for="sym"> <input id="sym" type="checkbox" checked /> <span>Use 180° symmetry (nicer look)</span></label>

        <label for="seed">Random seed (optional)</label>
        <div class="row">
          <input id="seed" type="number" placeholder="random" />
          <button class="muted" id="btnSeed">Randomize</button>
        </div>

        <label class="row" for="inclSol"> <input id="inclSol" type="checkbox" /> <span>Include solution page when printing</span></label>

        <div class="btns">
          <button id="btnGenerate" title="Generate a new puzzle and show it">Generate puzzle</button>
          <button class="secondary" id="btnPrint" title="Open the browser's print dialog">Print</button>
        </div>
        <div class="status" id="status">Ready.</div>
      </div>
    </section>

    <section class="board-area card" aria-live="polite">
      <div class="print-title">Sudoku</div>
      <div class="print-meta" id="meta"></div>
      <div class="grid" id="puzzle"></div>

      <div class="solution" id="solutionBlock">
        <div class="page-break"></div>
        <div class="print-title">Solution</div>
        <div class="grid" id="solution"></div>
      </div>

      <div class="legend no-print">
        <span>Blank = empty cell</span>
        <span>Bold lines = 3×3 boxes</span>
      </div>
    </section>
  </div>

  <script>
  // Utility RNG with optional fixed seed (mulberry32)
  function mulberry32(a){
    return function(){
      var t = a += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }
  function newRNG(seed){
    if (seed == null || Number.isNaN(Number(seed))) {
      // cryptographically seeded fallback to time
      if (window.crypto && crypto.getRandomValues){
        const buf = new Uint32Array(1); crypto.getRandomValues(buf); return mulberry32(buf[0] || Date.now()>>>0);
      }
      return mulberry32((Date.now() ^ Math.random()*1e9)>>>0);
    } else {
      return mulberry32(Number(seed)>>>0);
    }
  }
  function shuffle(arr, rnd){
    for (let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(rnd()* (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // Grid helpers
  function emptyGrid(){ return Array.from({length:9}, ()=> Array(9).fill(0)); }
  function cloneGrid(g){ return g.map(row => row.slice()); }

  // Base pattern solved grid
  function basePatternValue(r,c){ return ((r%3)*3 + Math.floor(r/3) + c) % 9 + 1; }

  function generateSolved(rnd){
    let g = emptyGrid();
    for (let r=0;r<9;r++) for (let c=0;c<9;c++) g[r][c] = basePatternValue(r,c);

    // Row bands
    let bands = [0,1,2]; shuffle(bands, rnd);
    g = reorderRowBands(g, bands);
    for (let b=0;b<3;b++){ const perm = shuffle([0,1,2], rnd); g = reorderRowsInBand(g, b, perm); }

    // Column stacks
    let stacks = [0,1,2]; shuffle(stacks, rnd);
    g = reorderColStacks(g, stacks);
    for (let s=0;s<3;s++){ const perm = shuffle([0,1,2], rnd); g = reorderColsInStack(g, s, perm); }

    // Relabel digits 1..9
    const relabel = shuffle([1,2,3,4,5,6,7,8,9], rnd);
    for (let r=0;r<9;r++) for (let c=0;c<9;c++) g[r][c] = relabel[g[r][c]-1];
    return g;
  }

  function reorderRowBands(g, perm){
    const out = emptyGrid(); let dst=0;
    for (const b of perm){ const src=b*3; for (let i=0;i<3;i++){ out[dst+i] = g[src+i].slice(); } dst+=3; }
    return out;
  }
  function reorderRowsInBand(g, band, perm){
    const out = g.map(r=>r.slice()); const start = band*3; const rows=[g[start], g[start+1], g[start+2]];
    for (let i=0;i<3;i++) out[start+i] = rows[perm[i]].slice();
    return out;
  }
  function reorderColStacks(g, perm){
    const out = emptyGrid();
    for (let r=0;r<9;r++){
      let row=[]; for (const s of perm){ row = row.concat(g[r].slice(s*3, s*3+3)); }
      out[r] = row;
    }
    return out;
  }
  function reorderColsInStack(g, stack, perm){
    const out = g.map(r=>r.slice()); const start=stack*3;
    for (let r=0;r<9;r++){
      const cols=[g[r][start], g[r][start+1], g[r][start+2]];
      out[r][start] = cols[perm[0]]; out[r][start+1] = cols[perm[1]]; out[r][start+2] = cols[perm[2]];
    }
    return out;
  }

  // Solver (count solutions up to limit)
  function countSolutions(grid, limit=2){
    const g = cloneGrid(grid);
    const rowMask = new Uint16Array(9), colMask = new Uint16Array(9), boxMask = new Uint16Array(9);
    const empties = [];
    const boxIndex = (r,c)=> Math.floor(r/3)*3 + Math.floor(c/3);

    for (let r=0;r<9;r++) for (let c=0;c<9;c++){
      const d = g[r][c];
      if (d===0){ empties.push([r,c]); }
      else{ const bit = 1<<d; rowMask[r]|=bit; colMask[c]|=bit; boxMask[boxIndex(r,c)]|=bit; }
    }

    function candidatesMask(r,c){
      const used = rowMask[r] | colMask[c] | boxMask[boxIndex(r,c)];
      return (~used) & 0x3FE; // bits 1..9 valid
    }

    function pickMRV(){
      let best=-1, bestCount=10;
      for (let i=0;i<empties.length;i++){
        const [r,c]=empties[i]; if (r<0) continue; // removed slot marker
        const mask=candidatesMask(r,c);
        const cnt = Math.clz32(mask)===32 ? 0 : popcount16(mask);
        if (cnt<bestCount){ best=i; bestCount=cnt; if (cnt===1) break; }
      }
      return best;
    }

    function popcount16(x){ x = x - ((x>>>1)&0x5555); x = (x&0x3333) + ((x>>>2)&0x3333); return (((x + (x>>>4)) & 0x0F0F) * 0x0101) >>> 8; }

    let solutions=0;

    function dfs(){
      if (solutions>=limit) return;
      // find next cell
      let idx = pickMRV();
      if (idx===-1){ // either solved or stuck with markers only
        // confirm no empty real cells remain
        for (let k=0;k<empties.length;k++){ if (empties[k][0] >= 0) return; }
        solutions++; return;
      }
      const r=empties[idx][0], c=empties[idx][1];
      // mark slot as taken by swapping out with last active; we use marker approach for simplicity
      empties[idx][0] = -1; // mark removed
      const mask=candidatesMask(r,c);
      for (let m=mask; m; m &= (m-1)){
        const bit = m & -m; const d = Math.clz32(bit)===32 ? 0 : Math.log2(bit)|0; // d in 1..9
        const b = 1<<d;
        g[r][c]=d; rowMask[r]|=b; colMask[c]|=b; boxMask[boxIndex(r,c)]|=b;
        dfs();
        g[r][c]=0; rowMask[r]&=~b; colMask[c]&=~b; boxMask[boxIndex(r,c)]&=~b;
        if (solutions>=limit) break;
      }
      empties[idx][0] = r; // restore
    }

    dfs();
    return solutions;
  }

  // Removal with uniqueness guarantee
  function removeCells(rnd, solved, percent=60, symmetric=true, maxRetries=5){
    const MAX_REM = 64; // at least 17 clues remain
    let requested = Math.floor(81*percent/100);
    let target = Math.min(requested, MAX_REM);
    if (symmetric && (target%2===1)) target--; // even pairs

    let best = cloneGrid(solved), bestRemoved=0;

    for (let attempt=0; attempt<Math.max(1,maxRetries); attempt++){
      const puz = cloneGrid(solved);
      let removed = 0;

      if (symmetric){
        const pairs=[];
        for (let r=0;r<9;r++) for (let c=0;c<9;c++){
          const rr=8-r, cc=8-c;
          if (r>rr || (r===rr && c>cc)) continue; // canonical half
          if (r===rr && c===cc) continue;         // skip center
          pairs.push([[r,c],[rr,cc]]);
        }
        shuffle(pairs, rnd);
        for (const pr of pairs){
          if (removed>=target) break;
          const [a,b]=pr; const [r1,c1]=a, [r2,c2]=b;
          if (puz[r1][c1]===0 || puz[r2][c2]===0) continue;
          const sv1=puz[r1][c1], sv2=puz[r2][c2];
          puz[r1][c1]=0; puz[r2][c2]=0;
          if (countSolutions(puz,2)>=2){ puz[r1][c1]=sv1; puz[r2][c2]=sv2; }
          else removed+=2;
        }
      } else {
        const cells=[]; for (let r=0;r<9;r++) for (let c=0;c<9;c++) cells.push([r,c]);
        shuffle(cells, rnd);
        for (const a of cells){
          if (removed>=target) break;
          const [r,c]=a; if (puz[r][c]===0) continue;
          const sv=puz[r][c]; puz[r][c]=0;
          if (countSolutions(puz,2)>=2) puz[r][c]=sv; else removed++;
        }
      }

      if (removed>bestRemoved){ bestRemoved=removed; best=puz; }
      if (removed>=target) break;
    }

    return { puzzle: best, removed: bestRemoved, achieved: bestRemoved*100/81 };
  }

  // Rendering
  function renderGrid(container, grid){
    const tbl = document.createElement('table');
    for (let r=0;r<9;r++){
      const tr=document.createElement('tr');
      for (let c=0;c<9;c++){
        const td=document.createElement('td');
        const v=grid[r][c];
        td.textContent = v? String(v): '\u00A0'; // nbsp for even boxes
        tr.appendChild(td);
      }
      tbl.appendChild(tr);
    }
    container.innerHTML=''; container.appendChild(tbl);
  }

  // Orchestrate UI
  const elPercent = document.getElementById('percent');
  const elPercentLabel = document.getElementById('percentLabel');
  const elSym = document.getElementById('sym');
  const elSeed = document.getElementById('seed');
  const elBtnSeed = document.getElementById('btnSeed');
  const elBtnGen = document.getElementById('btnGenerate');
  const elBtnPrint = document.getElementById('btnPrint');
  const elStatus = document.getElementById('status');
  const elMeta = document.getElementById('meta');
  const elPuzzle = document.getElementById('puzzle');
  const elSolution = document.getElementById('solution');
  const elInclSol = document.getElementById('inclSol');
  const elSolBlock = document.getElementById('solutionBlock');

  elPercent.addEventListener('input', ()=> elPercentLabel.textContent = elPercent.value + '%');
  elBtnSeed.addEventListener('click', ()=>{ elSeed.value = Math.floor(Math.random()*1e9); });
  elBtnPrint.addEventListener('click', ()=>{ window.print(); });
  elInclSol.addEventListener('change', ()=>{ elSolBlock.classList.toggle('visible', elInclSol.checked); if(!elInclSol.checked) elSolBlock.classList.add('hidden'); else elSolBlock.classList.remove('hidden'); });

  function generate(){
    const t0 = performance.now();
    const seedVal = elSeed.value === '' ? null : Number(elSeed.value);
    const rnd = newRNG(seedVal);
    const solved = generateSolved(rnd);
    const percent = Number(elPercent.value);
    const symmetric = elSym.checked;
    const res = removeCells(rnd, solved, percent, symmetric, 5);

    renderGrid(elPuzzle, res.puzzle);
    renderGrid(elSolution, solved);
    elSolBlock.classList.toggle('visible', elInclSol.checked);

    const t1 = performance.now();
    const achieved = res.achieved.toFixed(1);
    const when = new Date();
    elMeta.textContent = `Removed: ${res.removed} cells (${achieved}%). Seed: ${seedVal ?? 'random'}. Symmetry: ${symmetric? 'on':'off'}.`;
    elStatus.textContent = `Generated in ${(t1-t0).toFixed(0)} ms. Unique-solution ensured.`;
  }

  elBtnGen.addEventListener('click', generate);
  // first render on load
  generate();
  </script>
</body>
</html>
